name: GHBot
version: '${version}'
main: dev.ghbot.GHBotPlugin
api-version: '1.21'
authors: [GH]
description: GH-Bot — AI builder & editing agent for PaperMC (GH000, GH001, ...). Hands-off building from chat or console.

commands:
  gh:
    description: GH-bot control and admin commands
    usage: /gh <command> [args]
    aliases: [ghbot, gh000]
    permission: ghbot.admin

permissions:
  ghbot.admin:
    description: Full access to GH-bot (ops by default)
    default: op
