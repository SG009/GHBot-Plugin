<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gh-bot · chat</title>
<style>
  body{background:#0a0a0a;color:#f5f2e9;font-family:ui-monospace,Consolas,monospace;margin:0;display:flex;flex-direction:column;height:100vh}
  h1{font-size:16px;letter-spacing:.08em;padding:14px 18px;border-bottom:1px solid #ffffff22;margin:0}
  #log{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .u{background:#ffffff14;align-self:flex-end;padding:8px 12px;border-radius:12px;max-width:75%}
  .b{background:#15150f;border:1px solid #ffffff14;align-self:flex-start;padding:8px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
  #row{display:flex;gap:10px;padding:12px 18px;border-top:1px solid #ffffff22}
  input{flex:1;background:#15150f;border:1px solid #ffffff22;color:#f5f2e9;border-radius:8px;padding:10px 12px;font-family:inherit}
  button{background:#f5f2e9;color:#0a0a0a;border:0;border-radius:8px;padding:10px 18px;font-family:inherit;font-weight:700;cursor:pointer}
  .dim{color:#8d8a7e;font-size:11px;padding:2px 18px 12px}
</style></head>
<body>
<h1>gh-bot · <span style="color:#85a63e">chat</span></h1>
<div id="log"><div class="b">Hey! I'm GH-bot. Ask me anything — designs, builds, server stuff. (AI provider status: see provider list in-game.)</div></div>
<div class="dim">Replies come from the server's configured AI provider (Gemini / Ollama / fallback).</div>
<div id="row"><input id="in" placeholder="Ask GH-bot…" autofocus><button onclick="send()">Send</button></div>
<script>
const log=document.getElementById('log'), inp=document.getElementById('in');
function add(cls,txt){const d=document.createElement('div');d.className=cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;}
async function send(){
  const t=inp.value.trim(); if(!t) return;
  inp.value=''; add('u',t);
  add('b','…');
  try{
    const r=await fetch('/chat?msg='+encodeURIComponent(t),{method:'POST'});
    const txt=await r.text();
    log.lastChild.remove();
    add('b',txt.replace(/§./g,''));
  }catch(e){ log.lastChild.remove(); add('b','Error: '+e); }
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body></html>
