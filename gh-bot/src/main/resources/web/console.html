<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>gh-bot · console</title>
<style>
  :root{--bg:#0b0e0a;--panel:#131a10;--line:#ffffff14;--txt:#f5f2e9;--dim:#8d8a7e;--acc:#85a63e;--bubble-user:#1c2a14;--bubble-bot:#151b12;--radius:18px}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,ui-monospace,Consolas,monospace;margin:0;display:flex;flex-direction:column;height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(11,14,10,.92);backdrop-filter:blur(6px)}
  header h1{font-size:16px;letter-spacing:.04em;margin:0}
  header .tag{font-size:10px;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 10px}
  #main{flex:1;display:flex;min-height:0}
  #chat{flex:1;display:flex;flex-direction:column;min-width:0}
  #log{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5;scroll-behavior:smooth}
  /* ── Clean bubbles (no avatar, no sender row) ── */
  .bubble{max-width:80%;padding:9px 13px;border-radius:var(--radius);position:relative;word-wrap:break-word}
  .bubble.user{align-self:flex-end;background:var(--bubble-user);border-bottom-right-radius:5px}
  .bubble.bot{align-self:flex-start;background:var(--bubble-bot);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bubble.evt{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--dim);font-size:12px;max-width:92%;padding:5px 10px;text-align:center}
  .bubble.evt .t{display:none}
  .bubble .t{display:block;font-size:10px;color:var(--dim);margin-bottom:2px;letter-spacing:.02em;text-align:right}
  .bubble .txt{white-space:pre-wrap}
  .bubble .txt p{margin:0 0 6px}
  .bubble .txt p:last-child{margin-bottom:0}
  .bubble .txt ul,.bubble .txt ol{margin:4px 0 6px;padding-left:18px}
  .bubble .txt li{margin:1px 0}
  .bubble .txt h1,.bubble .txt h2,.bubble .txt h3{font-size:13px;margin:8px 0 4px}
  .bubble .txt code{background:#0a0e08;border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12px}
  .bubble .txt pre{background:#0a0e08;border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto;font-size:12px}
  .bubble .txt a{color:var(--acc)}
  .bubble.local .txt{color:#c9b6e8}
  .tool{display:block;color:var(--acc);font-size:11px;margin-top:5px}
  .tool:before{content:"⚙ "}
  .thinking{color:var(--dim);font-size:12px;padding:6px 4px;font-style:italic}
  .reason{color:var(--dim);font-size:12px;border-left:2px solid var(--line);padding-left:10px;white-space:pre-wrap}
  .reason summary{cursor:pointer;color:var(--dim)}
  .draft{align-self:flex-start;background:#121a0e;border:1px solid var(--acc);border-radius:14px;padding:10px 12px;max-width:85%;width:100%}
  .draft .tag{font-size:10px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .draft textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;font-family:inherit;font-size:12px;resize:vertical;min-height:44px}
  .draft button{margin-top:6px;background:var(--acc);color:#0a0a0a;font-size:11px;padding:6px 12px;border:0;border-radius:8px;cursor:pointer}
  #row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(11,14,10,.95);backdrop-filter:blur(6px)}
  input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:11px 16px;font-family:inherit;font-size:14px;outline:none}
  input:focus{border-color:var(--acc)}
  button{background:var(--acc);color:#0a0a0a;border:0;border-radius:999px;padding:11px 18px;font-family:inherit;font-weight:700;cursor:pointer}
  #upBtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:10px 12px;font-size:16px;border-radius:999px;line-height:1}
  #sendBtn.stop{background:#a33;color:#fff}   /* v0.21.44 — Stop state */
  button:disabled{opacity:.45;cursor:default}
  #side{width:250px;border-left:1px solid var(--line);padding:12px 14px;overflow-y:auto;font-size:12px}
  #side h3{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:10px 0 6px}
  .kv{display:flex;justify-content:space-between;padding:2px 0;color:var(--dim)}
  .kv b{color:var(--txt);font-weight:600}
  .bot{display:flex;justify-content:space-between;padding:2px 0}
  .bot .id{color:var(--acc)}
  .bot .act{color:var(--dim)}
  #tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0}
  .chip{border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11px;color:var(--dim);cursor:pointer}
  .chip:hover{color:var(--txt);border-color:var(--acc)}
  .local{margin-left:auto;font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .local button{font-size:10px;padding:5px 9px;background:var(--panel);color:var(--txt);border:1px solid var(--line)}
  .local select{font-size:10px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-family:inherit}
  .local label{display:flex;align-items:center;gap:3px;color:var(--dim)}
  .local input[type=checkbox]{accent-color:var(--acc)}
  .local .st{color:var(--dim);display:block;width:100%;flex-basis:100%}
  @media(max-width:760px){#side{display:none}}
</style></head>
<body>
<header><h1>gh-bot · <span style="color:var(--acc)">console</span></h1><span class="tag">agent</span>
  <div class="local">
    <div class="local">
    <label title="Secretary engine + model — WASM runs on ANY phone (no WebGPU needed)">
      <span class="lbl">Secretary</span>
      <select id="localModel">
        <optgroup label="WASM · CPU — 0KB, works on ANY phone">
          <option value="wasm:onnx-community/Qwen2.5-0.5B-Instruct">Qwen2.5-0.5B · WASM · universal</option>
        </optgroup>
        <optgroup label="WebGPU — needs 32KB shared mem">
          <option value="webllm:Qwen3.5-0.8B">Qwen3.5-0.8B · WebGPU</option>
          <option value="webllm:Qwen3.5-2B">Qwen3.5-2B · WebGPU · recommended</option>
          <option value="webllm:Qwen3.5-4B">Qwen3.5-4B · WebGPU · max</option>
        </optgroup>
        <optgroup label="Auto">
          <option value="auto">Auto · WebGPU if it fits, else WASM</option>
        </optgroup>
      </select>
    </label>
    <button id="localBtn">Load secretary</button>
    <label class="chk" title="Qwen reasoning tokens — off = faster"><input type="checkbox" id="thinkBox">thinking</label>
    <span class="st" id="localSt"></span>
  </div>
</div>
</header>
<div id="tools">
  <span class="chip" onclick="q('status')">status</span>
  <span class="chip" onclick="q('scan 20')">scan 20</span>
  <span class="chip" onclick="q('build a small house')">build a house</span>
  <span class="chip" onclick="q('undo')">undo</span>
  <span class="chip" onclick="q('list your tools')">tools</span>
</div>
<div id="main">
  <div id="chat">
    <div id="log"></div>
    <div id="row">
      <button id="upBtn" onclick="document.getElementById('upFile').click()" title="Upload a .json build spec, an image, or a .txt command list">📎</button>
      <input type="file" id="upFile" accept=".json,.png,.jpg,.jpeg,.webp,.gif,.txt,.cmd,.mcfunction,text/plain" style="display:none">
      <input id="in" placeholder="Ask or command GH-bot…" autofocus><button id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>
  <div id="side"><h3>System</h3><div id="sys"></div><h3>Bots</h3><div id="bots"></div></div>
</div>
<script>
const log=document.getElementById('log'), inp=document.getElementById('in');
const sessionId = localStorage.getItem('ghsession') || ('s'+Math.random().toString(36).slice(2,10));
localStorage.setItem('ghsession', sessionId);

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return escHtml(s).replace(/"/g,'&quot;');}
// ── Telegram-style bubble builder ──
function addBubble(role, txt, cls){
  const bubble=document.createElement('div'); bubble.className='bubble '+role+(cls?(' '+cls):'');
  const t=document.createElement('span'); t.className='t';
  t.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const txtEl=document.createElement('div'); txtEl.className='txt';
  txtEl.innerHTML=renderMd(txt||'');
  bubble.appendChild(t); bubble.appendChild(txtEl);
  log.appendChild(bubble); log.scrollTop=log.scrollHeight;
  return bubble;
}
// markdown-lite renderer (safe): **bold**, *italic*, `code`, ```pre```, - lists, headers, links
function renderMd(t){
  let s=escHtml(t);
  // un-escape \<x\> the AI emits around args (e.g. \<radius\> → <radius>)
  s=s.replace(/\\</g,'<').replace(/\\>/g,'>').replace(/\\\*/g,'*');
  // fenced code blocks
  s=s.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c+'</pre>');
  // inline code
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  // headers
  s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/^# (.*)$/gm,'<h3>$1</h3>');
  // bold + italic
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
  // links
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // bare URLs (e.g. the 3D viewer link) → clickable
  s=s.replace(/(https?:\/\/[^\s<"']+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // PREVIEW_IMG: <url> → inline image (v0.21.34 BlockGPT-style)
  s=s.replace(/PREVIEW_IMG:\s*(https?:\/\/[^\s<"']+)/g,
    '<img src="$1" alt="build preview" style="max-width:100%;border-radius:10px;margin:6px 0;border:1px solid var(--line);display:block" onclick="window.open(this.src)">');
  // lines
  const lines=s.split('\n'); const out=[];
  let inList=false;
  for(const line of lines){
    const l=line.trim();
    if(l.startsWith('- ')||l.startsWith('• ')){
      if(!inList){out.push('<ul>');inList=true;}
      out.push('<li>'+l.replace(/^[-•]\s+/,'')+'</li>');
    }else{
      if(inList){out.push('</ul>');inList=false;}
      out.push(l===''?'<p></p>':'<p>'+l+'</p>');
    }
  }
  if(inList)out.push('</ul>');
  return out.join('');
}
// keep old add() for non-chat helpers (drafts/status) — maps to a bot bubble
function add(cls,txt){ return addBubble(cls==='u'?'user':'bot', txt, cls==='b'?'':cls); }

let busy=false;
let currentAbort=null;   // v0.21.44 — Stop button: abort controller for the in-flight fetch
let stopSent=false;      // v0.21.45 — only send /api/cancel once (no spam)
const sendBtn=document.getElementById('sendBtn');
// v0.21.44 — while a request is running the Send button becomes STOP (like ChatGPT/Claude).
function setSendStop(){
  if(busy && stopSent){ sendBtn.textContent='Stopping…'; sendBtn.disabled=true; }
  else { sendBtn.textContent = busy ? 'Stop' : 'Send'; sendBtn.disabled=false; }
  sendBtn.classList.toggle('stop', busy);
}
async function send(){
  if(busy){ doStop(); return; }   // button is now Stop — cancel the running request
  const t=inp.value.trim(); if(!t) return;
  inp.value=''; busy=true; stopSent=false; setSendStop();
  add('u',t);
  try{ if(localEngine){ await sendLocal(t); } else { await sendToTechnician(t); } }
  finally{ busy=false; stopSent=false; setSendStop(); }
}
async function q(t){ if(busy) return; busy=true; stopSent=false; setSendStop(); add('u',t); try{ await sendToTechnician(t); }finally{ busy=false; stopSent=false; setSendStop(); } }
// v0.21.44/45 — Stop: tell the server to abort the AI call (saves provider tokens), then drop
// the client connection. Server-side cancel works even for hanging plan/build calls.
// Only the FIRST press fires; the button turns into a disabled "Stopping…" so you can't spam.
async function doStop(){
  if(stopSent) return;
  stopSent=true; setSendStop();
  try{ await fetch('/api/cancel?session='+sessionId,{method:'POST'}); }catch(e){}
  if(currentAbort){ try{ currentAbort.abort(); }catch(e){} }
  add('b','⏹ **Stopped.** Request cancelled — no more tokens burned.');
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});

// keep the input row visible above the phone keyboard
function fixViewport(){ const vv=window.visualViewport; if(vv&&vv.height>0){ document.body.style.height=vv.height+'px'; log.scrollTop=log.scrollHeight; } }
if(window.visualViewport){ window.visualViewport.addEventListener('resize',fixViewport); window.visualViewport.addEventListener('scroll',fixViewport); }
fixViewport();

/* ── technician route (server AI + tools, SSE) ── */
async function sendToTechnician(t){
  const think=add('thinking','…');
  let bubble=null, buf='';
  const ctrl=new AbortController(); currentAbort=ctrl;   // v0.21.44 — Stop button
  try{
    const r=await fetch('/chat?msg='+encodeURIComponent(t)+'&session='+sessionId+'&stream=1',
      {method:'POST', signal:ctrl.signal});
    if(!r.ok || !r.body){ think.textContent='Error '+r.status; return; }
    const reader=r.body.getReader();
    const dec=new TextDecoder();
    let sse='';
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      sse+=dec.decode(value,{stream:true});
      let idx;
      while((idx=sse.indexOf('\n\n'))>=0){
        const ev=sse.slice(0,idx); sse=sse.slice(idx+2);
        // v0.21.22 — SSE spec: join ALL data: lines of one event with \n (multi-line payloads).
        // The old loop processed each line separately and DROPPED non-"data:" lines, so
        // multi-line replies were truncated to their first line (the "crammed" bug).
        let data='';
        for(const line of ev.split('\n')){
          if(line.startsWith('data:')) data += (data? '\n':'') + line.slice(5);
        }
        data=data.trim();
        if(data==='' || data==='[DONE]') continue;
        // v0.21.25 — the server sends each chunk as a quoted JSON string; parse it back
        // so multi-line replies survive SSE framing intact. If parse fails (older server),
        // unescape literal \n as a fallback.
        try { data = JSON.parse(data); }
        catch(e){ data = data.replace(/\\n/g,'\n').replace(/\\r/g,''); }
        buf+=data;
        const toolM=data.match(/[⟦[](tool:.*?)[⟧\]]/);
        if(toolM){
          if(!bubble){ think.remove(); bubble=addBubble('bot',''); }
          const span=document.createElement('span'); span.className='tool';
          span.textContent=toolM[1].replace(/[⟦⟧\[\]]/g,'');
          const txtEl=bubble.querySelector('.txt');
          (txtEl||bubble).appendChild(span);
          continue;
        }
        if(data.match(/^[⟦\[](result:.*?)[⟧\]]/) || data.startsWith('⟦result:') || data.startsWith('[result:')){
          // v0.21.35 — show any PREVIEW_IMG from a tool result as an inline image in the bubble
          const pm=data.match(/PREVIEW_IMG:\s*(https?:\/\/[^\s<"']+)/);
          if(pm){
            if(!bubble){ think.remove(); bubble=addBubble('bot',''); }
            const te=bubble.querySelector('.txt');
            if(te){ te.innerHTML += '<img src="'+pm[1]+'" alt="build preview" style="max-width:100%;border-radius:10px;margin:6px 0;border:1px solid var(--line);display:block;cursor:zoom-in" onclick="window.open(this.src)">'; }
            log.scrollTop=log.scrollHeight;
          }
          continue;
        }
        if(!bubble){ think.remove(); bubble=addBubble('bot',''); }
        const txtEl=bubble.querySelector('.txt');
        if(txtEl) txtEl.innerHTML=renderMd(buf);
        log.scrollTop=log.scrollHeight;
      }
    }
    if(!bubble && think.parentNode) think.remove();
  }catch(e){
    // v0.21.44 — aborted by the Stop button: doStop already showed "Stopped"; just tidy up.
    if(ctrl.signal.aborted){ if(think.parentNode) think.remove(); }
    else think.textContent='Error: '+e;
  }finally{ if(currentAbort===ctrl) currentAbort=null; }
}

// ── v0.21.40 — upload button: .json build spec → staged directly (no paste into the
// bubble — solves 140KB+ specs); image → GH-bot "sees" it (vision) → generates a build.
async function uploadFile(f){
  if(!f || busy) return;
  const isImg=f.type.startsWith('image/');
  const isScript=/\.(txt|cmd|mcfunction)$/i.test(f.name) || f.type==='text/plain';
  const prompt=isScript ? (inp.value||'').trim() : '';
  if(isScript && prompt) inp.value='';
  busy=true; setSendStop();
  add('u', (isImg?'🖼️ ':'📄 ')+'**'+escHtml(f.name)+'** ('+fmtSize(f.size)+')'+(prompt?('\n_'+escHtml(prompt)+'_'):''));
  const think=add('thinking', isImg?'Reading image…': isScript?'Reading command script…':'Parsing build spec…');
  try{
    let url='/upload?name='+encodeURIComponent(f.name)+'&session='+encodeURIComponent(sessionId);
    if(prompt) url+='&prompt='+encodeURIComponent(prompt);
    const r=await fetch(url, {method:'POST', body:f});
    const t=await r.text();
    think.remove();
    if(!r.ok){ add('bot','⚠️ **Upload failed ('+r.status+')**\n'+t); return; }
    // the server reply already includes PREVIEW_IMG: → renderMd turns it into an inline image
    add('bot', t);
    if(isImg){
      const bubble=add('bot','_Sending what GH-bot saw to the build pipeline…_');
      const te=bubble.querySelector('.txt');
      const thumb=document.createElement('img');
      thumb.src=URL.createObjectURL(f);
      thumb.style.cssText='max-width:100%;border-radius:10px;margin:6px 0;border:1px solid var(--line);display:block';
      te.appendChild(thumb);
    }
  }catch(e){
    think.remove(); add('bot','⚠️ Upload error: '+e);
  }finally{ busy=false; setSendStop(); }
}
function fmtSize(n){ return n>=1048576?(n/1048576).toFixed(1)+' MB' : n>=1024?(n/1024).toFixed(1)+' KB' : n+' B'; }
document.getElementById('upFile').addEventListener('change', ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(f) uploadFile(f);
});

// welcome message
addBubble('bot','👋 **GH-bot console** — I am the **Technician** (server AI).\nJust say things like: "scan 100 at 86 86 262", "build a house", "status", "change the motd to Welcome!" — I run them for real and show the tool chip.\n📎 also accepts a **.txt command list** (preview first, then say **run**).\nClick **Load secretary** for the on-device assistant (it drafts requests for me to execute).');

// status sidebar
async function status(){
  try{
    const r=await fetch('/api/status'); const j=await r.json();
    let s='';
    if(j.sys) for(const [k,v] of Object.entries(j.sys)) s+=`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
    document.getElementById('sys').innerHTML=s||'<div class="kv">—</div>';
    let b='';
    (j.bots||[]).forEach(x=>{ b+=`<div class="bot"><span class="id">${x.id}</span><span class="act">${x.activity}${x.role!=='general'?' · '+x.role:''}</span></div>`; });
    document.getElementById('bots').innerHTML=b||'<div class="kv">—</div>';
  }catch(e){}
}
status(); setInterval(()=>{ status(); pollEvents(); },5000);

// ── v0.21.42 — review-activity feed: Approve / Deny / Export pressed in the 3D viewer
// show up here in the chat console as bubbles (server records them in a small feed
// that we poll alongside /api/status). Cursor = how many events we've already shown.
let evtCursor=0;
async function pollEvents(){
  try{
    const r=await fetch('/api/events?after='+evtCursor);
    if(!r.ok) return;
    const j=await r.json();
    // v0.21.43 — server restarted/reloaded and the feed reset: drop our cursor to the new
    // feed WITHOUT rendering the pre-reload replay, so fresh events keep showing up.
    if(j.reset){ evtCursor = (j.next!=null)?j.next:0; return; }
    (j.events||[]).forEach(e=>{ addBubble('bot', e, 'evt'); });
    if(j.next!=null) evtCursor=j.next;
  }catch(e){}
}

/* ------------------------------------------------------------------ *
 *  SECRETARY — on-device local AI via WebLLM (MLCEngine), WebGPU.
 *  No cloud, no API key: downloads once from HuggingFace, cached, offline.
 *  Job: brainstorm + DRAFT requests for the technician. Drafts are wrapped
 *  in ⟦draft⟧ … ⟦/draft⟧; the console renders an editable card with a
 *  "Send to technician" button that routes the draft through the server.
 *  Needs: Chromium (Chrome/Edge on Android) + secure context
 *  (https, or http://127.0.0.1:8580/console — plain LAN http hides WebGPU).
 * ------------------------------------------------------------------ */
const WL_URL='https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.84/+esm';
const TJ_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
// ── Secretary engines ────────────────────────────────────────────────
// 1) WebLLM/MLCEngine (WebGPU): best quality, but its prebuilt WASM shaders
//    need maxComputeWorkgroupStorageSize = 32KB. On GPUs capped at 16KB
//    (common on Mali/Android) it cannot initialize at all — no model variant
//    changes that, the kernels are precompiled.
// 2) Transformers.js (WASM/CPU): no WebGPU needed, works on ANY phone — same
//    engine your old ai.html used (Qwen via @xenova/transformers). Slower,
//    smaller models, but it RUNS. This is the universal fallback.
const ENGINES={
 'webllm':{name:'WebLLM (WebGPU, needs 32KB shared mem)', wasm:false},
 'wasm':{name:'Transformers.js (WASM/CPU, 0KB — any phone)', wasm:true},
};
// size -> fallback ladder of full model ids (different quantizations/kernels)
const WL_LADDER={
 'Qwen3.5-0.8B':['Qwen3.5-0.8B-q4f16_1-MLC','Qwen3.5-0.8B-q4f32_1-MLC','Qwen3.5-0.8B-q0f16-MLC'],
 'Qwen3.5-2B':['Qwen3.5-2B-q4f16_1-MLC','Qwen3.5-2B-q4f32_1-MLC'],
 'Qwen3.5-4B':['Qwen3.5-4B-q4f16_1-MLC','Qwen3.5-4B-q4f32_1-MLC'],
};
const WASM_MODELS={ 'onnx-community/Qwen2.5-0.5B-Instruct':{label:'Qwen2.5-0.5B',dl:'~200MB'} };

const localBtn=document.getElementById('localBtn'), localSt=document.getElementById('localSt');
const localSel=document.getElementById('localModel'), thinkBox=document.getElementById('thinkBox');
let localEngine=null, localHistory=null, secretarySystem=null;
let engineKind=null; // 'webllm' | 'wasm'

// remember model choice
const savedModel=localStorage.getItem('ghlocalmodel');
if(savedModel){ const ok=[...localSel.options].some(o=>o.value===savedModel); if(ok) localSel.value=savedModel; }
localSel.onchange=()=>{
  localStorage.setItem('ghlocalmodel', localSel.value);
  if(localEngine && !confirm('Switch secretary engine/model? (frees the loaded one)')){ localSel.value=savedModel; return; }
  unloadLocal();
  localSt.textContent='Changed — click Load secretary.';
};

function fmtMB(b){ return (b/1048576).toFixed(0)+' MB'; }

if(!navigator.gpu){
  // no WebGPU: WASM secretary still works — don't disable the button
  localSt.textContent='No WebGPU here — WASM secretary works on any phone (slower but no GPU needed). Technician unaffected.';
}else{
  localSt.textContent='WebGPU ready — pick a model and load the secretary. WASM options work even without WebGPU.';
}

function unloadLocal(){
  if(localEngine){ try{ localEngine.unload&&localEngine.unload(); }catch(e){} localEngine=null; localHistory=null; engineKind=null; }
}

/* Pull the technician's capability sheet once, for realistic drafts. */
async function buildSecretarySystem(){
  if(secretarySystem) return secretarySystem;
  let tools='', commands='', bot='GH000';
  try{
    const r=await fetch('/api/tools');
    if(r.ok){ const j=await r.json(); tools=j.tools||''; commands=j.commands||''; bot=j.bot||'GH000'; }
  }catch(e){}
  secretarySystem=
   'You are the GH-bot SECRETARY, an on-device assistant for the server manager. You have NO tools and NO '+
   'server access — you cannot build, edit, scan or run commands. Your job is to help the manager think and to '+
   'DRAFT requests for the technician on the server (bot '+bot+').\n'+
   'The technician can run these tools:\n'+(tools||'(unavailable)')+'\n'+
   'The technician knows these commands:\n'+(commands||'(unavailable)')+'\n'+
   'When the manager asks for something to be DONE on the server, reply with a one-line confirmation and then a '+
   'draft wrapped in ⟦draft⟧ … ⟦/draft⟧. Keep the draft concise, in the technician\'s language (a chat phrase or a '+
   'command line). Example: ⟦draft⟧build a small medieval house with a garden⟦/draft⟧.\n'+
   'If the manager is just thinking out loud or asking for advice, answer normally WITHOUT a draft.\n'+
   'Never invent tools or commands that are not listed above.';
  return secretarySystem;
}

/* ── Load: decide engine; any WebGPU failure → auto-fallback to WASM ── */
localBtn.onclick=async()=>{
  if(localEngine){ unloadLocal(); localBtn.textContent='Load secretary'; localSt.textContent='Secretary unloaded — technician only. Click to reload.'; return; }
  const choice=localSel.value; // 'webllm:size' | 'wasm:model' | 'auto'
  const parts=choice.split(':');
  const want=parts[0]; const param=parts.slice(1).join(':');
  localBtn.disabled=true; localBtn.textContent='Loading…';
  localSt.textContent='Loading secretary… (first run downloads the model, then cached)';
  try{
    let ok=false;
    if(want==='webllm'){ ok=await loadEngine('webllm', param); if(!ok){ add('b','⚠ WebGPU model can\'t run on this GPU — auto-switching to the WASM secretary (works on any phone).'); ok=await loadEngine('wasm','onnx-community/Qwen2.5-0.5B-Instruct'); } }
    else if(want==='wasm'){ ok=await loadEngine('wasm', param||'onnx-community/Qwen2.5-0.5B-Instruct'); }
    else { // auto
      ok=await loadEngine('webllm','Qwen3.5-2B');
      if(!ok){ add('b','⚠ No WebGPU model fits this GPU — auto-switching to the WASM secretary (works on any phone).'); ok=await loadEngine('wasm','onnx-community/Qwen2.5-0.5B-Instruct'); }
    }
    if(!ok) throw new Error('all engines failed to load');
    localHistory=[{role:'system', content: await buildSecretarySystem()}];
    localBtn.disabled=false; localBtn.textContent='Unload secretary';
    localSt.textContent=engineKind==='wasm' ? 'Secretary online (WASM/CPU — works without WebGPU). Drafts marked L.' : 'Secretary online (WebGPU). Drafts marked L.';
    add('b','Secretary online ('+(engineKind==='wasm'?'WASM/CPU — no WebGPU needed':'WebGPU')+'). Ask me anything, or say e.g. "draft a castle build" — I\'ll propose a request you can edit and send to the technician. Thinking '+(thinkBox.checked?'on':'off')+'.');
  }catch(e){
    localBtn.disabled=false; localBtn.textContent='Load secretary'; localEngine=null; engineKind=null;
    const msg=(e&&e.message)||String(e);
    let tip='technician still works.';
    if(/maxComputeWorkgroupStorageSize|workgroup/i.test(msg)){
      tip='Your GPU caps WebGPU shared memory at 16KB, so the WebLLM shaders (32KB) can\'t run — hardware/driver limit, not config. The WASM secretary options (0KB) run on any phone; or update Chrome / try Edge/Opera/Canary.';
    }else if(/context|secure/i.test(msg)){
      tip='WebGPU needs a secure context: open http://127.0.0.1:8580/console on the phone itself (or use https). Plain LAN http hides WebGPU.';
    }
    localSt.textContent='Secretary load failed: '+msg+' — '+tip;
    add('b','⚠ Secretary couldn\'t start: '+msg+' — '+tip);
  }
};

/* ── Engine loaders ─────────────────────────────────────────────────── */
async function loadEngine(kind, param){
  if(kind==='webllm'){
    const size=param;
    const ladder=WL_LADDER[size]||[size+'-q4f16_1-MLC'];
    const {CreateMLCEngine}=await import(WL_URL);
    let lastErr=null;
    for(let i=0;i<ladder.length;i++){
      const candidate=ladder[i];
      try{
        localSt.textContent=(i>0?'(fallback '+i+'/'+ladder.length+') ':'')+'Loading '+candidate+' …';
        localEngine=await CreateMLCEngine(candidate,{
          initProgressCallback:(p)=>{
            if(p.progress<1){
              const tot=p.totalBytes>0?(' / '+fmtMB(p.totalBytes)):'';
              localSt.textContent='Downloading '+(i>0?'(fallback '+i+') ':'')+candidate+' '+Math.round(p.progress*100)+'% ('+fmtMB(p.loadedBytes||0)+tot+')…';
            }else{ localSt.textContent='Compiling '+(i>0?'(fallback '+i+') ':'')+candidate+' on WebGPU…'; }
          }
        });
        engineKind='webllm';
        if(i>0) add('b','⚠ Secretary used fallback variant: '+candidate+' (the default hit a GPU limit — this one works).');
        return true;
      }catch(err){ lastErr=err; localEngine=null; if(i<ladder.length-1) localSt.textContent='Variant '+candidate+' failed — trying next…'; }
    }
    if(/maxComputeWorkgroupStorageSize|workgroup/i.test((lastErr&&lastErr.message)||'')){
      localSt.textContent='WebGPU shared-memory limit (16KB) — switching to WASM secretary.';
    }
    return false;
  }
  if(kind==='wasm'){
    const model=param||'onnx-community/Qwen2.5-0.5B-Instruct';
    const meta=WASM_MODELS[model]||{label:model,dl:''};
    const mod=await import(TJ_URL);
    const env=mod.env||{};
    env.allowLocalModels=false;
    if(env.backends&&env.backends.onnx&&env.backends.onnx.wasm){ env.backends.onnx.wasm.numThreads=1; }
    localSt.textContent='Downloading '+meta.label+' ('+meta.dl+') via Transformers.js (WASM/CPU)…';
    localSt.textContent='WASM '+meta.label+': compiling…';
    const gen=await mod.pipeline('text-generation', model, {
      device:'wasm', dtype:'q4',
      progress_callback:(p)=>{ if(p&&p.status) localSt.textContent='WASM '+meta.label+': '+p.status+' …'; },
    });
    localEngine={ kind:'wasm', gen:gen, model:model };
    engineKind='wasm';
    return true;
  }
  return false;
}

/* Extract ⟦draft⟧…⟦/draft⟧ (or single-line) from a reply. */
function extractDrafts(text){
  const out=[]; const re=/⟦draft⟧([\s\S]*?)⟦\/draft⟧/g; let m;
  while((m=re.exec(text))){ out.push(m[1].trim()); }
  if(out.length===0){ const r=/⟦draft⟧\s*([^\n⟧]+)/; m=r.exec(text); if(m) out.push(m[1].trim()); }
  return out;
}

/* Editable secretary card → Send to technician. */
function renderDraftCard(draft){
  const card=document.createElement('div'); card.className='draft';
  const tag=document.createElement('div'); tag.className='tag'; tag.textContent='✉ secretary draft — review / edit / send to technician';
  const ta=document.createElement('textarea'); ta.value=draft; ta.rows=Math.max(2, Math.min(5, draft.split('\n').length));
  const btn=document.createElement('button'); btn.textContent='📨 Send to technician';
  btn.onclick=()=>{ add('u',ta.value); card.remove(); busy=true; setSendStop(); sendToTechnician(ta.value).finally(()=>{busy=false; setSendStop();}); };
  card.appendChild(tag); card.appendChild(ta); card.appendChild(btn);
  log.appendChild(card); log.scrollTop=log.scrollHeight;
}

/* Qwen chat template for the WASM engine (manual — version-agnostic). */
function qwenPrompt(messages){
  let out='';
  for(const m of messages){
    if(m.role==='system') out+='<|im_start|>system\n'+m.content+'<|im_end|>\n';
    else if(m.role==='user') out+='<|im_start|>user\n'+m.content+'<|im_end|>\n';
    else if(m.role==='assistant') out+='<|im_start|>assistant\n'+m.content+'<|im_end|>\n';
  }
  out+='<|im_start|>assistant\n';
  return out;
}
/* Qwen1.5 template is ChatML-compatible too. */

/* Route a message to the on-device secretary (streaming for WebLLM, whole-text for WASM). */
async function sendLocal(t){
  const think=add('thinking','…');
  const bubble=addBubble('bot',''); bubble.classList.add('local');
  let buf='', reason='';
  localHistory.push({role:'user', content:t});
  try{
    if(engineKind==='webllm'){
      const resp=await localEngine.chat.completions.create({
        messages:localHistory, stream:true,
        enable_thinking: thinkBox.checked, max_tokens: 600,
      });
      for await (const chunk of resp){
        const d=chunk.choices&&chunk.choices[0]&&chunk.choices[0].delta;
        if(!d) continue;
        if(d.reasoning_content){ reason+=d.reasoning_content; continue; }
        if(d.content){ buf+=d.content; const te=bubble.querySelector('.txt'); if(te) te.innerHTML=renderMd(buf); log.scrollTop=log.scrollHeight; }
      }
    }else{
      // WASM: non-streaming; CPU generation is slow on phones — show a live status
      bubble.textContent='…';
      const st=document.getElementById('localSt'); const oldSt=st?st.textContent:''; if(st) st.textContent='Generating… (WASM/CPU — can take ~30s on a phone)';
      const out=await localEngine.gen(qwenPrompt(localHistory), { max_new_tokens: 150, do_sample:false });
      if(st) st.textContent=oldSt;
      const full=(out&&out[0]&&out[0].generated_text)||'';
      const prompt=qwenPrompt(localHistory);
      buf = full.startsWith(prompt) ? full.slice(prompt.length) : full;
      { const te=bubble.querySelector('.txt'); if(te) te.innerHTML=renderMd(buf.trim()); }
      log.scrollTop=log.scrollHeight;
    }
  }catch(e){
    bubble.textContent='Secretary error: '+e.message+' — click Unload and retry, or use the technician.';
    think.remove(); return;
  }
  think.remove();
  localHistory.push({role:'assistant', content:buf});
  const drafts=extractDrafts(buf);
  const clean=buf.replace(/⟦draft⟧[\s\S]*?⟦\/draft⟧/g,'').replace(/⟦draft⟧[^\n]*/g,'').trim();
  { const te=bubble.querySelector('.txt'); if(te) te.innerHTML=renderMd(clean || '(draft only — see card below)'); }
  drafts.forEach(d=>renderDraftCard(d));
  if(reason && thinkBox.checked){
    const r=document.createElement('details'); r.className='reason';
    r.innerHTML='<summary>thinking ('+reason.length+' chars)</summary>'+escHtml(reason);
    log.appendChild(r); log.scrollTop=log.scrollHeight;
  }
}
</script></body></html>
